<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Angolan Slang Dictionary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="header">

            <div class="brand">

                <div class="brand-icon">
                    A
                </div>

                <div class="brand-text">
                    <h1>Angolan Slang</h1>
                    <span>Dictionary</span>
                </div>

            </div>

            <button
                class="icon-button"
                id="menu-button"
                aria-label="Open menu"
            >
                ☰
            </button>

        </header>


        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main id="main-content">

            <!-- Content will be rendered here by JavaScript -->

        </main>


        <!-- =========================
             BOTTOM NAVIGATION
        ========================== -->

        <nav class="bottom-navigation">

            <button
                class="nav-item active"
                data-page="home"
            >
                <span class="nav-icon">⌂</span>
                <span>Home</span>
            </button>


            <button
                class="nav-item"
                data-page="dictionary"
            >
                <span class="nav-icon">▤</span>
                <span>Dictionary</span>
            </button>


            <button
                class="nav-item"
                data-page="search"
            >
                <span class="nav-icon">⌕</span>
                <span>Search</span>
            </button>


            <button
                class="nav-item"
                data-page="saved"
            >
                <span class="nav-icon">♡</span>
                <span>Saved</span>
            </button>

        </nav>

    </div>

    <script src="script.js"></script>

</body>
</html>
