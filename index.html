<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#A63D40"
    >

    <meta
        name="description"
        content="Discover Angolan slang, expressions, meanings and natural examples."
    >

    <title>Angolan Slang Dictionary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <!-- =========================
             DECORATIVE PATTERN
        ========================== -->

        <div class="pattern pattern-top"></div>


        <!-- =========================
             HEADER
        ========================== -->

        <header class="header">

            <button
                class="brand"
                type="button"
                data-route="home"
                aria-label="Go to home"
            >

                <div class="brand-symbol">
                    A
                </div>

                <div class="brand-text">
                    <strong>Angolan Slang</strong>
                    <span>Dictionary</span>
                </div>

            </button>


            <button
                class="header-button"
                id="menu-button"
                type="button"
                aria-label="Open menu"
            >
                ☰
            </button>

        </header>


        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main id="main-content"></main>


        <!-- =========================
             BOTTOM NAVIGATION
        ========================== -->

        <nav
            class="bottom-navigation"
            aria-label="Main navigation"
        >

            <button
                class="nav-item active"
                data-route="home"
                type="button"
            >
                <span class="nav-icon">⌂</span>
                <span class="nav-label">Home</span>
            </button>


            <button
                class="nav-item"
                data-route="dictionary"
                type="button"
            >
                <span class="nav-icon">▤</span>
                <span class="nav-label">Dictionary</span>
            </button>


            <button
                class="nav-item nav-search"
                data-route="search"
                type="button"
            >
                <span class="nav-icon">⌕</span>
                <span class="nav-label">Search</span>
            </button>


            <button
                class="nav-item"
                data-route="saved"
                type="button"
            >
                <span class="nav-icon">♡</span>
                <span class="nav-label">Saved</span>
            </button>

        </nav>


        <!-- =========================
             SIDE MENU
        ========================== -->

        <div
            class="menu-overlay"
            id="menu-overlay"
        ></div>


        <aside
            class="side-menu"
            id="side-menu"
            aria-hidden="true"
        >

            <div class="menu-header">

                <div>
                    <p class="menu-small-title">
                        ANGOLAN SLANG
                    </p>

                    <h2>
                        Explore
                    </h2>
                </div>


                <button
                    class="close-menu"
                    id="close-menu"
                    type="button"
                    aria-label="Close menu"
                >
                    ×
                </button>

            </div>


            <button
                class="menu-item"
                data-route="daily"
                type="button"
            >
                <span>☀</span>
                3 Words of the Day
            </button>


            <button
                class="menu-item"
                data-route="packs"
                type="button"
            >
                <span>▦</span>
                Packs
            </button>


            <button
                class="menu-item"
                data-route="game"
                type="button"
            >
                <span>✦</span>
                Maka Challenge
            </button>


            <button
                class="menu-item"
                data-route="updates"
                type="button"
            >
                <span>✦</span>
                Updates
            </button>


            <button
                class="menu-item"
                data-route="about"
                type="button"
            >
                <span>i</span>
                About the Dictionary
            </button>


            <button
                class="menu-item"
                data-route="settings"
                type="button"
            >
                <span>⚙</span>
                Settings
            </button>


            <button
                class="menu-item"
                data-route="profile"
                type="button"
            >
                <span>●</span>
                My Profile
            </button>

        </aside>

    </div>


    <script src="script.js"></script>

</body>
</html>
